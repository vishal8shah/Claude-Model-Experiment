<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora — One Prompt, Three AI Models</title>
<meta name="description" content="Blind taste test: the same one-shot prompt given to three frontier AI models. Which is which?">
<style>
  :root{
    --bg:#0d0f16;
    --surface:#161927;
    --line:#272c42;
    --text:#e9ecf6;
    --muted:#8a92ac;
    --accent:#6ee7b7;
    --accent-2:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    display:flex;flex-direction:column;
    background:var(--bg);color:var(--text);
    font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 20px;border-bottom:1px solid var(--line);
    background:var(--surface);flex-wrap:wrap;
  }
  .title h1{font-size:16px;font-weight:700;letter-spacing:.02em}
  .title p{font-size:12px;color:var(--muted);margin-top:2px}
  .title b{color:var(--accent)}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tabs{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px}
  .tabs button{
    appearance:none;border:0;cursor:pointer;border-radius:999px;
    padding:8px 22px;font-size:13.5px;font-weight:700;letter-spacing:.06em;
    background:transparent;color:var(--muted);font-family:inherit;
    transition:background .2s ease,color .2s ease;
  }
  .tabs button:hover{color:var(--text)}
  .tabs button.active{
    background:linear-gradient(120deg,var(--accent),var(--accent-2));
    color:#0d0f16;
  }
  .open-link{
    font-size:12px;color:var(--muted);text-decoration:none;
    border:1px solid var(--line);border-radius:999px;padding:8px 14px;
    transition:color .2s,border-color .2s;
  }
  .open-link:hover{color:var(--text);border-color:var(--muted)}
  .reveal-btn{
    appearance:none;cursor:pointer;font-family:inherit;
    font-size:12px;font-weight:700;letter-spacing:.04em;
    color:var(--accent);background:transparent;
    border:1px solid var(--line);border-radius:999px;padding:8px 14px;
    transition:color .2s,border-color .2s,background .2s;
  }
  .reveal-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(110,231,183,.08)}
  .reveal-btn:disabled{cursor:default;color:var(--muted)}
  /* Reveal modal */
  .overlay{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;padding:20px;
    background:rgba(8,10,18,.72);backdrop-filter:blur(6px);
  }
  .overlay.open{display:flex}
  .modal{
    width:min(480px,100%);background:var(--surface);
    border:1px solid var(--line);border-radius:20px;padding:28px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.7);
    animation:pop .25s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h2{font-size:17px;margin-bottom:6px}
  .modal .warn{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:18px}
  .modal .row-btns{display:flex;gap:10px;justify-content:flex-end}
  .modal .row-btns button{
    appearance:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;
    border-radius:999px;padding:9px 20px;border:1px solid var(--line);
    background:transparent;color:var(--muted);transition:all .2s;
  }
  .modal .row-btns button:hover{color:var(--text);border-color:var(--muted)}
  .modal .row-btns button.primary{
    background:linear-gradient(120deg,var(--accent),var(--accent-2));
    color:#0d0f16;border-color:transparent;
  }
  .answers{display:none;flex-direction:column;gap:10px}
  .answers.show{display:flex}
  .answer{
    display:flex;align-items:center;gap:14px;
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    opacity:0;transform:translateY(6px);
    animation:rise .4s ease forwards;
  }
  .answer:nth-child(2){animation-delay:.15s}
  .answer:nth-child(3){animation-delay:.3s}
  @keyframes rise{to{opacity:1;transform:none}}
  .answer .letter{
    width:38px;height:38px;flex:none;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;color:#0d0f16;
    background:linear-gradient(120deg,var(--accent),var(--accent-2));
  }
  .answer .model{font-size:15px;font-weight:700}
  .answer .view{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:none}
  .answer .view:hover{color:var(--text)}
  main{flex:1;position:relative}
  iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;
    background:var(--bg);opacity:0;transition:opacity .25s ease;
  }
  iframe.loaded{opacity:1}
  @media (max-width:640px){
    header{padding:12px 14px}
    .tabs button{padding:7px 16px}
    .open-link{display:none}
  }
</style>
</head>
<body>
  <header>
    <div class="title">
      <h1>Aurora · Blind Taste Test</h1>
      <p>Same one-shot prompt, three frontier AI models, zero edits. <b>Which one is which?</b></p>
    </div>
    <div class="controls">
      <nav class="tabs" aria-label="Choose a version">
        <button data-page="a.html" class="active">A</button>
        <button data-page="b.html">B</button>
        <button data-page="c.html">C</button>
      </nav>
      <a class="open-link" id="openLink" href="a.html" target="_blank" rel="noopener">Open full page ↗</a>
      <button class="reveal-btn" id="revealBtn" type="button">Reveal</button>
    </div>
  </header>
  <main>
    <iframe id="frame" src="a.html" title="AI-generated dashboard"></iframe>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div id="confirmStep">
        <h2 id="modalTitle">Spoilers ahead</h2>
        <p class="warn">This shows which AI model generated each page. If you haven't cast your vote yet, look at all three first — that's the fun part.</p>
        <div class="row-btns">
          <button type="button" id="cancelBtn">Not yet</button>
          <button type="button" id="confirmBtn" class="primary">Reveal the models</button>
        </div>
      </div>
      <div class="answers" id="answers"></div>
    </div>
  </div>
<script>
  (function(){
    const frame = document.getElementById('frame');
    const openLink = document.getElementById('openLink');
    const buttons = document.querySelectorAll('.tabs button');
    frame.addEventListener('load', () => frame.classList.add('loaded'));
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('active')) return;
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        frame.classList.remove('loaded');
        frame.src = btn.dataset.page;
        openLink.href = btn.dataset.page;
        history.replaceState(null, '', '#' + btn.dataset.page.replace('.html',''));
      });
    });
    const hash = location.hash.replace('#','');
    if (['a','b','c'].includes(hash)) {
      document.querySelector(`.tabs button[data-page="${hash}.html"]`)?.click();
    }

    /* ---------- Reveal ---------- */
    // Set to an ISO date string (e.g. '2026-07-03T18:00:00Z') to lock the
    // reveal until then; null means the reveal is available immediately.
    const REVEAL_AT = null;
    // Answer key, lightly encoded so a casual view-source doesn't spoil the poll.
    const KEY = 'eyJhIjogIkNsYXVkZSBTb25uZXQgNSIsICJiIjogIkNsYXVkZSBGYWJsZSA1IiwgImMiOiAiQ2xhdWRlIE9wdXMgNC44In0=';

    const revealBtn = document.getElementById('revealBtn');
    const overlay = document.getElementById('overlay');
    const confirmStep = document.getElementById('confirmStep');
    const answers = document.getElementById('answers');
    let countdownTimer = null;

    function locked(){ return REVEAL_AT && Date.now() < Date.parse(REVEAL_AT); }

    function updateButton(){
      if (locked()) {
        const ms = Date.parse(REVEAL_AT) - Date.now();
        const h = Math.floor(ms/3600000), m = Math.ceil((ms%3600000)/60000);
        revealBtn.disabled = true;
        revealBtn.textContent = `Reveal in ${h}h ${m}m`;
      } else {
        revealBtn.disabled = false;
        revealBtn.textContent = 'Reveal';
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      }
    }
    updateButton();
    if (locked()) countdownTimer = setInterval(updateButton, 30000);

    function closeOverlay(){
      overlay.classList.remove('open');
      confirmStep.style.display = '';
      answers.classList.remove('show');
      answers.innerHTML = '';
    }

    revealBtn.addEventListener('click', () => {
      if (locked()) return;
      overlay.classList.add('open');
    });
    document.getElementById('cancelBtn').addEventListener('click', closeOverlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });

    document.getElementById('confirmBtn').addEventListener('click', () => {
      const map = JSON.parse(atob(KEY));
      confirmStep.style.display = 'none';
      answers.innerHTML = ['a','b','c'].map(k => `
        <div class="answer">
          <span class="letter">${k.toUpperCase()}</span>
          <span class="model">${map[k]}</span>
          <a class="view" href="${k}.html" target="_blank" rel="noopener">view ↗</a>
        </div>`).join('');
      answers.classList.add('show');
    });
  })();
</script>
</body>
</html>
